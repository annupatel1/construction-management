spring.datasource.url=jdbc:h2:mem:buildtrack;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Tests run the real Flyway migrations against H2 in MySQL mode.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.type.preferred_enum_jdbc_type=VARCHAR
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/common,classpath:db/migration/{vendor}
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=true

jwt.secret=test-only-secret-that-is-long-enough-for-hmac-sha-256
jwt.expiration=3600000

otp.delivery.phone=CONSOLE
otp.delivery.email=CONSOLE
otp.secret=test-only-otp-secret-that-is-long-enough
otp.expiry-minutes=5
otp.max-attempts=5
otp.resend-cooldown-seconds=1
otp.max-per-hour=100

app.cors.allowed-origins=http://localhost:5173
auth.login.max-attempts=100
auth.login.window-seconds=60
