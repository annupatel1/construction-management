spring.application.name=construction-management

# Database (override with environment variables in production)
# WARNING: These defaults (root/root) are for local development only.
# Never commit real credentials. In production, set DB_URL, DB_USERNAME, DB_PASSWORD via the environment.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/construction_management_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

# Flyway owns the schema; Hibernate must not create or change tables.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.type.preferred_enum_jdbc_type=VARCHAR

# Every request gets a correlation id (X-Request-Id) so support can match a UI error to a log line.
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{requestId:-}] %logger{36} - %msg%n

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/common,classpath:db/migration/{vendor}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.validate-on-migrate=true

# JWT - set JWT_SECRET (32+ characters) in production. Never commit a real secret.
jwt.secret=${JWT_SECRET:dev-only-secret-change-before-deploying-0123456789}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Password login throttling (per phone/email, in-memory)
auth.login.max-attempts=${LOGIN_MAX_ATTEMPTS:10}
auth.login.window-seconds=${LOGIN_WINDOW_SECONDS:900}

# Frontend origins allowed to call the API (comma separated)
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}

# ---------------- OTP ----------------
# Where one-time codes are delivered. CONSOLE prints the code in the server log (development only).
#   phone: CONSOLE | SMS (MSG91)       email: CONSOLE | EMAIL (SMTP)
otp.delivery.phone=${OTP_PHONE_DELIVERY:CONSOLE}
otp.delivery.email=${OTP_EMAIL_DELIVERY:CONSOLE}
otp.secret=${OTP_SECRET:${jwt.secret}}
otp.expiry-minutes=5
otp.max-attempts=5
otp.resend-cooldown-seconds=30
otp.max-per-hour=5

# SMS via MSG91 (needs an approved DLT template for India)
otp.sms.msg91.auth-key=${MSG91_AUTH_KEY:}
otp.sms.msg91.template-id=${MSG91_TEMPLATE_ID:}

# Email via SMTP. Only needed when OTP_EMAIL_DELIVERY=EMAIL. Set these environment variables
# (Spring maps them automatically), e.g. for Gmail with an app password:
#   SPRING_MAIL_HOST=smtp.gmail.com  SPRING_MAIL_PORT=587
#   SPRING_MAIL_USERNAME=you@gmail.com  SPRING_MAIL_PASSWORD=<app password>
#   MAIL_FROM=you@gmail.com
otp.mail.from=${MAIL_FROM:no-reply@localhost}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
