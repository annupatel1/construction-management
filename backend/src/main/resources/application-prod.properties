# Production profile: every secret and endpoint must come from the environment.
# Start the app with SPRING_PROFILES_ACTIVE=prod (or --spring.profiles.active=prod).
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

otp.secret=${OTP_SECRET}
otp.delivery.phone=${OTP_PHONE_DELIVERY:SMS}
otp.delivery.email=${OTP_EMAIL_DELIVERY:EMAIL}
otp.sms.msg91.auth-key=${MSG91_AUTH_KEY}
otp.sms.msg91.template-id=${MSG91_TEMPLATE_ID}
otp.mail.from=${MAIL_FROM}
spring.mail.host=${SPRING_MAIL_HOST}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}

app.cors.allowed-origins=${CORS_ORIGINS}

server.error.include-message=never
server.error.include-stacktrace=never
spring.jpa.show-sql=false
