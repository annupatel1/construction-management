name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Java 21)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Verify backend
        working-directory: backend
        run: mvn -B verify

  frontend:
    name: Frontend (Node 22)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install, test and build frontend
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build

  ai-platform:
    name: AI Platform (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai_platform/requirements-api.txt

      - name: Install API dependencies
        working-directory: ai_platform
        run: pip install -r requirements-api.txt

      - name: Run tests
        working-directory: ai_platform
        run: python test_suite.py

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Prepare environment
        run: cp .env.example .env

      - name: Validate Compose files
        run: |
          docker compose config --quiet
          docker compose --profile proxy config --quiet

      - name: Validate Caddyfile
        run: |
          docker run --rm \
            -e DOMAIN=buildtrack.example.com \
            -e ACME_EMAIL=admin@example.com \
            -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.8-alpine caddy validate --config /etc/caddy/Caddyfile

      - name: Build backend image
        run: docker build -t buildtrack-backend:ci ./backend

      - name: Build frontend image
        run: docker build -t buildtrack-frontend:ci ./frontend

      - name: Build AI image
        run: docker build -t buildtrack-ai:ci ./ai_platform

  release-scripts:
    name: Release scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check shell syntax
        run: bash -n scripts/*.sh deploy/*.sh

      - name: Test production preflight
        run: |
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          mkdir -p "$tmp/scripts"
          cp scripts/prod-preflight.sh "$tmp/scripts/"

          cat > "$tmp/.env" <<'ENV'
          DOMAIN=buildtrack.test
          ACME_EMAIL=admin@buildtrack.test
          SPRING_PROFILES_ACTIVE=prod
          JWT_SECRET=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          OTP_SECRET=bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
          OTP_EMAIL_DELIVERY=EMAIL
          OTP_PHONE_DELIVERY=DISABLED
          CORS_ORIGINS=https://buildtrack.test
          VITE_API_URL=https://buildtrack.test
          VITE_AI_URL=https://buildtrack.test/ai
          MAIL_FROM=no-reply@buildtrack.test
          SPRING_MAIL_HOST=smtp.gmail.com
          SPRING_MAIL_USERNAME=ci@gmail.com
          SPRING_MAIL_PASSWORD=ci-app-password
          DB_PASSWORD=ci-db-password
          DB_ROOT_PASSWORD=ci-root-password
          VITE_SUPPORT_EMAIL=support@buildtrack.test
          ENV

          "$tmp/scripts/prod-preflight.sh"

          sed -i 's/^OTP_EMAIL_DELIVERY=EMAIL/OTP_EMAIL_DELIVERY=CONSOLE/' "$tmp/.env"
          if "$tmp/scripts/prod-preflight.sh"; then
            echo "preflight accepted CONSOLE email OTP" >&2
            exit 1
          fi
