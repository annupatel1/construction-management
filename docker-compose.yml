name: buildtrack

services:
  db:
    image: docker.io/library/mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-construction_management_db}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MYSQL_USER: ${DB_USERNAME:-buildtrack}
      MYSQL_PASSWORD: ${DB_PASSWORD:-buildtrack}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 12
    # The database is reachable only inside the Compose network.
    # Uncomment for local debugging with a desktop SQL client:
    # ports:
    #   - "3306:3306"

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://db:3306/${DB_NAME:-construction_management_db}
      DB_USERNAME: ${DB_USERNAME:-buildtrack}
      DB_PASSWORD: ${DB_PASSWORD:-buildtrack}
      JWT_SECRET: ${JWT_SECRET}
      OTP_SECRET: ${OTP_SECRET:-}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      OTP_PHONE_DELIVERY: ${OTP_PHONE_DELIVERY:-CONSOLE}
      OTP_EMAIL_DELIVERY: ${OTP_EMAIL_DELIVERY:-CONSOLE}
      MSG91_AUTH_KEY: ${MSG91_AUTH_KEY:-}
      MSG91_TEMPLATE_ID: ${MSG91_TEMPLATE_ID:-}
      MAIL_FROM: ${MAIL_FROM:-no-reply@localhost}
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
      LOGIN_MAX_ATTEMPTS: ${LOGIN_MAX_ATTEMPTS:-10}
      LOGIN_WINDOW_SECONDS: ${LOGIN_WINDOW_SECONDS:-900}
      # Site photos are stored in the uploads-data volume.
      UPLOAD_DIR: /app/uploads
      UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-10485760}
      UPLOAD_MAX_FILE_SIZE: ${UPLOAD_MAX_FILE_SIZE:-10MB}
      UPLOAD_MAX_REQUEST_SIZE: ${UPLOAD_MAX_REQUEST_SIZE:-12MB}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-default}
      PORT: 8080
    # Reachable on the host only through localhost. In production, Caddy
    # proxies public HTTPS traffic to this service on the Compose network.
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - uploads-data:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  ai:
    build: ./ai_platform
    restart: unless-stopped
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.6-flash}
      AI_ALLOWED_ORIGINS: ${AI_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
      AI_API_KEY: ${AI_API_KEY:-}
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}
        VITE_AI_URL: ${VITE_AI_URL:-http://localhost:8000}
        VITE_AI_API_KEY: ${VITE_AI_API_KEY:-}
        VITE_SUPPORT_EMAIL: ${VITE_SUPPORT_EMAIL:-support@your-domain.example}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true

  # Optional production TLS reverse proxy. It is not started by `make up`.
  # Start it with:
  #   docker compose --profile proxy up -d --build
  # after setting DOMAIN and ACME_EMAIL in .env.
  caddy:
    image: docker.io/library/caddy:2.8-alpine
    profiles: ["proxy"]
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN:-}
      ACME_EMAIL: ${ACME_EMAIL:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    security_opt:
      - no-new-privileges:true

volumes:
  db-data:
  uploads-data:
  caddy-data:
  caddy-config:
