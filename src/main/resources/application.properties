# ============================================================
# Construction Management Platform - Production Configuration
# ============================================================
# ALL SECRETS MUST BE SET AS ENVIRONMENT VARIABLES IN PRODUCTION
# Never commit real credentials, OTP secrets, production tokens, or personal data.
# ============================================================

# Database (REQUIRED: Set these environment variables in production)
#   export DB_URL="jdbc:mysql://hostname:3306/database_name"
#   export DB_USERNAME="your_username"
#   export DB_PASSWORD="your_password"
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/construction_management_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# JWT - REQUIRED: Set a secure 32+ character secret in production
#   export JWT_SECRET="your-secure-random-string-min-32-chars"
# The dev-only value below will be used if JWT_SECRET is not set - CHANGE FOR PRODUCTION!
jwt.secret=${JWT_SECRET:dev-only-secret-change-before-deploying-must-be-32-chars-long-jwt}
jwt.expiration=8640000

# CORS - Set allowed origins for production frontend
#   export CORS_ORIGINS="https://your-frontend-domain.com,https://admin-your-frontend-domain.com"
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}

# ============================================================
# OTP (One-Time Password) Configuration
# ============================================================
# Delivery methods: phone: SMS (MSG91) | email: SMTP | console: (development only)
otp.delivery.phone=${OTP_PHONE_DELIVERY:CONSOLE}
otp.delivery.email=${OTP_EMAIL_DELIVERY:CONSOLE}
otp.secret=${OTP_SECRET:${jwt.secret}}
otp.expiry-minutes=5
otp.max-attempts=5
otp.resend-cooldown-seconds=30
otp.max-per-hour=5

# ============================================================
# SMS via MSG91 (India) - Requires DLT Approved Template
# ============================================================
# Get these from https://msg91.com after registering and getting DLT approved
#   export MSG91_AUTH_KEY="your-msg91-auth-key"
#   export MSG91_TEMPLATE_ID="your-dlt-approved-template-id"
otp.sms.msg91.auth-key=${MSG91_AUTH_KEY:}
otp.sms.msg91.template-id=${MSG91_TEMPLATE_ID:}

# ============================================================
# Email via SMTP (for OTP delivery when OTP_EMAIL_DELIVERY=EMAIL)
# ============================================================
# Set these if using email OTP delivery:
#   export SPRING_MAIL_HOST=smtp.gmail.com
#   export SPRING_MAIL_PORT=587
#   export SPRING_MAIL_USERNAME=your-email@gmail.com
#   export SPRING_MAIL_PASSWORD=your-app-password
#   export MAIL_FROM=your-email@gmail.com
otp.mail.from=${MAIL_FROM:no-reply@localhost}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ============================================================
# Server Configuration
# ============================================================
server.port=${PORT:8080}
